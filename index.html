<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>壹壹 · 我的私人工作台</title>
<meta name="theme-color" content="#b15a4f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="壹壹" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23b15a4f'/%3E%3Ctext x='90' y='124' font-size='104' text-anchor='middle' fill='%23f6f1ea'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E" />
<style>
  /* ====== 100元纸币低饱和配色（沿用，不更改） ====== */
  :root{
    --paper:#f6f1ea;      /* 纸币纸底 暖米 */
    --card:#fffdfa;       /* 卡片底 */
    --card-2:#fbf6ef;     /* 次级卡片 */
    --ink:#3d3631;        /* 主文字 墨色 */
    --muted:#918578;      /* 次要文字 */
    --line:#ece2d6;       /* 分隔线 */
    --primary:#b15a4f;    /* 100元主色·低饱和红 */
    --primary-soft:#dca79d;
    --primary-bg:#f6e6e1;
    --gold:#bd9a52;       /* 金色安全线·低饱和 */
    --gold-soft:#ecdcb4;
    --ok:#6f9b6e;         /* 完成绿 */
    --warn:#c9803f;       /* 提醒橙 */
    --shadow:0 6px 20px rgba(120,80,60,.10);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;
    display:flex;justify-content:center;
  }
  .phone{
    width:100%;max-width:480px;min-height:100vh;
    background:var(--paper);display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }

  /* ====== 欢迎页 ====== */
  #welcome{
    position:absolute;inset:0;z-index:50;background:linear-gradient(160deg,#f6e6e1,#f6f1ea 60%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;
  }
  #welcome .logo{font-size:64px;margin-bottom:8px;}
  #welcome h1{font-size:30px;margin:6px 0;letter-spacing:2px;color:var(--primary);}
  #welcome .date{color:var(--muted);font-size:15px;margin:2px 0;}
  #welcome .days{color:var(--gold);font-size:15px;margin:2px 0 22px;}
  #welcome .quote{
    background:var(--card);border-radius:14px;padding:16px 18px;max-width:340px;
    box-shadow:var(--shadow);color:var(--ink);font-size:16px;line-height:1.8;border-left:4px solid var(--primary-soft);
  }
  #welcome .enter{
    margin-top:26px;background:var(--primary);color:#fff;border:none;border-radius:24px;
    padding:11px 34px;font-size:16px;box-shadow:var(--shadow);cursor:pointer;
  }
  #welcome .enter:active{transform:scale(.97);}

  /* ====== 顶栏 ====== */
  .topbar{
    height:54px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:10;
  }
  .topbar .title{font-weight:700;font-size:17px;color:var(--primary);}
  .topbar .coins{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--gold-soft);
    color:#7a5b1e;padding:4px 10px;border-radius:14px;font-weight:700;font-size:14px;}
  .topbar .ico-btn{background:var(--card-2);border:1px solid var(--line);border-radius:10px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}
  .topbar .ico-btn:active{transform:scale(.94);}

  /* ====== 主体：左导航 + 右内容 ====== */
  .body{display:flex;flex:1 1 auto;min-height:0;}
  .nav{
    flex:0 0 116px;background:var(--card-2);border-right:1px solid var(--line);
    overflow-y:auto;padding:8px 6px;transition:flex-basis .2s,opacity .2s;
    -webkit-overflow-scrolling:touch;
  }
  .nav.collapsed{flex-basis:0;opacity:0;padding:0;overflow:hidden;}
  .nav .item{
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;margin:4px 0;
    border-radius:14px;cursor:pointer;color:var(--muted);position:relative;border:1px solid transparent;
  }
  .nav .item .emoji{font-size:22px;line-height:1;}
  .nav .item .label{font-size:11px;text-align:center;line-height:1.2;}
  .nav .item.active{background:var(--primary-bg);color:var(--primary);border-color:var(--primary-soft);font-weight:600;}
  .nav .item .dot{position:absolute;top:6px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .nav .item.dragging{opacity:.4;}
  .nav .item.drag-over{border-color:var(--primary);}
  .nav .item .grip{position:absolute;top:4px;left:4px;font-size:10px;opacity:.4;display:none;}
  .nav.editing .item{border:1px dashed var(--primary-soft);position:relative;padding-right:16px;}
  .nav.editing .grip{display:block;}
  .nav .item .mv{position:absolute;right:1px;font-size:11px;line-height:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 3px;cursor:pointer;color:var(--primary);width:14px;text-align:center;}
  .nav .item .mv:first-of-type{top:1px;}
  .nav .item .mv:last-of-type{bottom:1px;}

  .main{flex:1 1 auto;overflow-y:auto;padding:14px 14px 40px;-webkit-overflow-scrolling:touch;}
  .module{display:none;}
  .module.active{display:block;animation:fade .2s;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  h2.mod{font-size:20px;margin:2px 0 12px;display:flex;align-items:center;gap:8px;}
  h2.mod .gear{margin-left:auto;font-size:15px;background:var(--card-2);border:1px solid var(--line);
    border-radius:9px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);}
  h2.mod .gear:active{transform:scale(.94);}

  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .card.tight{padding:11px 13px;}
  .card h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px;}
  .card h3 .tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--muted);background:var(--card-2);padding:2px 8px;border-radius:10px;}
  .note{color:var(--muted);font-size:12.5px;line-height:1.6;}
  .muted{color:var(--muted);}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--card-2);border-radius:12px;padding:2px 9px;font-size:12px;color:var(--muted);}
  .pill.green{background:#dfeede;color:#3f6b3e;}
  .pill.gold{background:var(--gold-soft);color:#7a5b1e;}
  .pill.primary{background:var(--primary-bg);color:var(--primary);}
  .tag-line{border-left:3px solid var(--primary-soft);padding-left:10px;color:var(--ink);margin:6px 0;}

  .row{display:flex;align-items:center;gap:8px;}
  .row.between{justify-content:space-between;}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;box-shadow:var(--shadow);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:var(--card-2);color:var(--primary);border:1px solid var(--line);box-shadow:none;}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px;}
  .input,.textarea,select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;
    background:var(--card);color:var(--ink);font-family:inherit;resize:vertical;
  }
  textarea{display:block;}

  .checkin{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--primary-bg);
    border-radius:12px;padding:9px 12px;margin-bottom:12px;}
  .checkin .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--primary);display:flex;
    align-items:center;justify-content:center;color:#fff;font-size:15px;flex:0 0 auto;cursor:pointer;}
  .checkin.done .box{background:var(--primary);}
  .checkin .txt{font-size:13px;color:var(--primary);flex:1;}
  .checkin.done .txt{color:var(--muted);text-decoration:line-through;}

  .item-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row .thumb{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--card-2);
    display:flex;align-items:center;justify-content:center;font-size:18px;}
  .item-row .meta{flex:1;min-width:0;}
  .item-row .t{font-weight:600;font-size:14.5px;}
  .item-row .d{color:var(--muted);font-size:12.5px;}
  .item-row .linkbtn{color:var(--primary);font-size:12.5px;flex:0 0 auto;}
  .item-row .linkbtn.danger{color:var(--warn);}
  .wardrobe-grid .wt{font-size:12px;color:var(--ink);margin-top:2px;line-height:1.3;}
  .wardrobe-grid .wm{font-size:10.5px;color:var(--muted);}
  .empty{color:var(--muted);text-align:center;padding:18px;font-size:13px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .tabs .tab{flex:0 0 auto;padding:6px 12px;border-radius:12px;background:var(--card-2);color:var(--muted);
    font-size:13px;cursor:pointer;border:1px solid var(--line);white-space:nowrap;}
  .tabs .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .subtab{display:none;}
  .subtab.active{display:block;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card-2);border-radius:12px;padding:10px;text-align:center;}
  .stat .n{font-size:20px;font-weight:700;color:var(--primary);}
  .stat .l{font-size:11.5px;color:var(--muted);}

  table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
  table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;}
  table.tbl th{color:var(--muted);font-weight:500;}

  .progress{height:8px;background:var(--card-2);border-radius:6px;overflow:hidden;}
  .progress > i{display:block;height:100%;background:var(--primary);}

  /* 设置弹层 */
  #modal{position:absolute;inset:0;z-index:60;background:rgba(60,50,45,.42);display:none;align-items:center;justify-content:center;padding:24px;}
  #modal.show{display:flex;}
  #modal .panel{background:var(--card);border-radius:var(--radius);padding:18px;width:100%;max-width:360px;box-shadow:var(--shadow);}
  #modal .panel h3{margin:0 0 12px;}
  #modal .panel .close{float:right;color:var(--muted);cursor:pointer;}

  /* Toast */
  #toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:80;
    background:rgba(61,54,49,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:13.5px;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  /* 衣物缩略 */
  .wardrobe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .wardrobe-grid .wcell{border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:11px;color:var(--muted);}
  .wardrobe-grid .wcell .ph{height:54px;border-radius:8px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:4px;}
  .chip{display:inline-block;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:3px 10px;font-size:12px;margin:3px 4px 3px 0;cursor:pointer;}
  .chip.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .hidden{display:none!important;}

  /* 新闻资讯 */
  .news-header{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px;}
  .news-header .title{font-size:20px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;}
  .news-header .date{font-size:12.5px;color:var(--muted);}
  .news-banner{background:#dfeede;color:#3f6b3e;border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13.5px;}
  .news-banner i{font-size:18px;}
  .news-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  .news-tabs .tab{flex:0 0 auto;padding:6px 14px;border-radius:18px;background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;border:1px solid var(--line);white-space:nowrap;}
  .news-tabs .tab.active{background:#4caf50;color:#fff;border-color:#4caf50;}
  .news-list{background:var(--card);border-radius:var(--radius);padding:4px 14px;box-shadow:var(--shadow);}
  .news-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .news-row:last-child{border-bottom:none;}
  .news-row .rank{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:2px;}
  .news-row .rank.r1{background:#e74c3c;}
  .news-row .rank.r2{background:#f39c12;}
  .news-row .rank.r3{background:#f1c40f;color:#5a4a25;}
  .news-row .rank.rx{background:var(--card-2);color:var(--muted);}
  .news-row .body{flex:1;min-width:0;}
  .news-row .t{font-weight:600;font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .news-row .meta{font-size:12px;color:var(--muted);margin-top:4px;}
  .news-row .meta span{margin-right:10px;}
  .news-row .summary{font-size:12.5px;color:var(--ink);line-height:1.65;margin-top:8px;padding:9px 10px;background:var(--card-2);border-left:3px solid var(--primary-soft);border-radius:8px;}
  .news-row .summary b{color:var(--primary);}
</style>
</head>
<body>
<div class="phone">
  <!-- 欢迎页 -->
  <div id="welcome">
    <div class="logo">🌿</div>
    <h1>欢迎壹壹</h1>
    <div class="date" id="w_date">今天是 —</div>
    <div class="days" id="w_days">已运行 — 天</div>
    <div class="quote" id="w_quote">—</div>
    <button class="enter" id="w_enter">进入工作台</button>
  </div>

  <!-- 顶栏 -->
  <div class="topbar" id="topbar">
    <div class="ico-btn" id="btn_collapse" title="收起/展开导航">☰</div>
    <div class="title">壹壹</div>
    <div class="coins">🪙 <span id="coin_num">0</span></div>
    <div class="ico-btn" id="btn_edit" title="编辑模块顺序">✥</div>
    <div class="ico-btn" id="btn_backup" title="数据备份">💾</div>
  </div>

  <!-- 主体 -->
  <div class="body">
    <div class="nav" id="nav"></div>
    <div class="main" id="main"></div>
  </div>

  <div id="modal"><div class="panel" id="modal_panel"></div></div>
  <div id="toast"></div>
</div>

<script>
"use strict";
/* ============================================================
   壹壹 · 私人工作台（纯前端 + GitHub Pages data.json）
   配色沿用百元钞低饱和；交互：左导航联动 / 每日打卡 / 金币 / 拖拽排序 / 模块设置
   ============================================================ */

const APP_NAME = "壹壹";
const START_KEY = "yiyi_start_date";
const MODULES = [
  {id:"schedule", name:"日程总览", ico:"🗓️"},
  {id:"news",     name:"热点新闻", ico:"📰"},
  {id:"ai",       name:"AI快讯",   ico:"🤖"},
  {id:"finance",  name:"投资理财", ico:"💡"},
  {id:"review",   name:"市场复盘", ico:"📈"},
  {id:"english",  name:"英语学习", ico:"🗣️"},
  {id:"outfit",   name:"电子穿搭", ico:"👗"},
  {id:"health",   name:"健康饮食", ico:"🥗"},
  {id:"work",     name:"工作资源", ico:"🧰"},
  {id:"photo",    name:"拍照剪辑", ico:"🎬"},
  {id:"money",    name:"生活记账", ico:"💰"},
];
let current = "schedule";
let editing = false;
let REMOTE = null;

/* ---------- 本地存储 ---------- */
const DB = {
  get(k, d){ try{ const v = localStorage.getItem("yiyi_"+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("yiyi_"+k, JSON.stringify(v)); }catch(e){} },
};
const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const nowDate = () => new Date();
function daysBetween(a,b){ const ms=86400000; const da=new Date(a), db=new Date(b); da.setHours(0,0,0,0); db.setHours(0,0,0,0); return Math.round((db-da)/ms); }
function weekOfYear(d){ const t=new Date(d.getFullYear(),0,1); const w=Math.ceil((((d-t)/86400000)+t.getDay()+1)/7); return w; }
function dateSeed(){ const d=new Date(); return Math.floor((d-new Date(2026,0,1))/86400000); }
function isTradeDay(d){ d=d||new Date(); if(d.getDay()===0||d.getDay()===6) return false;
  const h={"2026-01-01":1,"2026-02-17":1,"2026-02-18":1,"2026-02-19":1,"2026-02-20":1,"2026-04-05":1,"2026-05-01":1,"2026-06-19":1,"2026-10-01":1,"2026-10-02":1,"2026-10-03":1};
  return !h[todayStr()]; }

/* ---------- 金币 / 打卡 ---------- */
function getCoins(){ return DB.get("coins",0); }
function renderCoins(){ document.getElementById("coin_num").textContent = getCoins(); }
function claim(moduleId, amount, label){
  const claims = DB.get("claims",{});
  if(claims[moduleId]===todayStr()){ toast("今天已领取过啦"); return false; }
  claims[moduleId]=todayStr(); DB.set("claims",claims);
  DB.set("coins", getCoins()+amount); renderCoins();
  toast("+"+amount+" 🪙 "+(label||"今日任务完成"));
  return true;
}
function isClaimed(moduleId){ return DB.get("claims",{})[moduleId]===todayStr(); }
function checkinHTML(id, label, amount){
  amount = amount||5;
  const done = isClaimed(id);
  return `<div class="checkin ${done?'done':''}" id="ci_${id}">
    <div class="box" onclick="doCheckin('${id}',${amount},'${label}')">${done?'✓':''}</div>
    <div class="txt">${label||"完成今日任务"}（+${amount}🪙）</div>
  </div>`;
}
function doCheckin(id, amount, label){
  const el=document.getElementById("ci_"+id);
  if(isClaimed(id)){ toast("今天已领取过啦"); return; }
  claim(id, amount, label);
  if(el){ el.classList.add("done"); el.querySelector(".box").textContent="✓"; }
}

/* ---------- Toast / Modal ---------- */
let toastT=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1800); }
function openModal(html){ document.getElementById("modal_panel").innerHTML=html; document.getElementById("modal").classList.add("show"); }
function closeModal(){ document.getElementById("modal").classList.remove("show"); }
function q(s){ return document.querySelector(s); }

/* ---------- 工具 ---------- */
function pick(pool, n, off){ off=off||0; const out=[]; const base=dateSeed()+off; for(let i=0;i<n;i++){ out.push(pool[(base+i)%pool.length]); } return out; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function youdaoUrl(text, isZh){ const q=encodeURIComponent(String(text||'').slice(0,160)); return 'https://dict.youdao.com/dictvoice?audio='+q+'&type='+(isZh?1:2); }
function playTTS(text, lang){
  text=String(text||'').trim(); if(!text){ return; }
  const isZh=/[一-鿿]/.test(text);
  // 主方案：有道 TTS 音频（国内可直连，真实发音），失败再退回浏览器内置语音
  let a=document.getElementById('tts_audio');
  if(!a){ a=document.createElement('audio'); a.id='tts_audio'; a.style.display='none'; document.body.appendChild(a); }
  a.src=youdaoUrl(text, isZh);
  const p=a.play();
  if(p&&p.catch){ p.catch(()=>{ synthFallback(text, isZh?'zh-CN':'en-US'); }); }
}
function synthFallback(text, lang){
  if(!('speechSynthesis' in window)){ toast('音频加载失败，请检查网络'); return; }
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang||'en-US'; u.rate=.95; speechSynthesis.speak(u); }
  catch(e){ toast('音频播放失败'); }

function getOrder(){ let o=DB.get("order",null); if(!o||o.length!==MODULES.length){ o=MODULES.map(m=>m.id); } return o; }
function renderNav(){
  const order = getOrder();

  nav.innerHTML = order.map((id,idx)=>{

    </div>`;
  }).join("");
  if(editing) bindDrag();
}
function moveModule(id, dir){ const o=getOrder(); const i=o.indexOf(id); const j=i+dir; if(j<0||j>=o.length) return;
  const t=o[i]; o[i]=o[j]; o[j]=t; DB.set("order",o); renderNav(); toast("已移动"); }
function moduleHasTask(id){ return true; } // 每个固定板块都有每日金币任务
function go(id){ current=id; renderNav(); renderContent(); document.getElementById("main").scrollTop=0; }
function bindDrag(){
  const nav=document.getElementById("nav");
  let dragId=null;
  nav.querySelectorAll(".item").forEach(it=>{
    it.addEventListener("dragstart",e=>{ dragId=it.dataset.id; it.classList.add("dragging"); });
    it.addEventListener("dragend",()=>{ it.classList.remove("dragging"); });
    it.addEventListener("dragover",e=>{ e.preventDefault(); it.classList.add("drag-over"); });
    it.addEventListener("dragleave",()=>it.classList.remove("drag-over"));
    it.addEventListener("drop",e=>{
      e.preventDefault(); it.classList.remove("drag-over");
      const target=it.dataset.id; if(!dragId||dragId===target) return;
      const o=getOrder(); const a=o.indexOf(dragId), b=o.indexOf(target);
      o.splice(b,0,o.splice(a,1)[0]); DB.set("order",o); renderNav();
    });
  });
}

let newsTab='all';
function setNewsTab(tab){ newsTab=tab; p_news(); }
function newsTime(i){ const h=Math.min(2+i,12); return h+'小时前'; }
function normNews(arr, src, baseIdx){
  baseIdx=baseIdx||0;
  return (arr||[]).map((it,i)=>{
    if(it && typeof it==='object' && it.t) return it;
    const title = (Array.isArray(it)?it[0]:it.title)||'';
    const desc = (Array.isArray(it)?it[1]:it.desc)||'';
    const link = (Array.isArray(it)?it[2]:it.link)||'';
    const srcReal = (Array.isArray(it)?it[3]:it.srcReal)||'';
    const ctime = (Array.isArray(it)?it[4]:it.ctime)||0;
    return {t:title, desc:desc, src:srcReal||src||'新浪滚动', time:ctime?relTime(ctime):newsTime(baseIdx+i), link:link};
  });
}
function relTime(ts){
  const diff = Math.max(0, (Date.now()/1000) - Number(ts||0));
  if(diff<3600) return Math.max(1,Math.round(diff/60))+'分钟前';
  if(diff<86400) return Math.round(diff/3600)+'小时前';
  return Math.round(diff/86400)+'天前';
}
function newsLink(it){
  if(it && it.link) return it.link;
  return 'https://www.baidu.com/s?wd=' + encodeURIComponent(it.t || '');
}
function hasNewsKw(s, kws){ s=String(s||''); return kws.some(k=>s.includes(k)); }
function buildNewsList(tab){
  const news=(REMOTE&&REMOTE.news)||{};
  const hot = normNews(news.hot, '新浪滚动', 0);
  const macro = normNews(news.macro, '新华社', hot.length);
  const livelihood = normNews(news.livelihood, '央视网', hot.length+macro.length);
  const finance = normNews(news.finance, '财联社', hot.length+macro.length+livelihood.length);
  const tech = pick(TECH_NEWS, 10);
  const world = pick(WORLD_NEWS, 10);
  const polKw = ['政策','央行','财政部','国务院','人大','法案','关税','通胀','降息','加息','汇率','赤字','降准','立法'];
  const techKw = ['AI','模型','芯片','科技','互联网','算力','机器人','新能源','电动车','智能','无人机','半导体','光伏','储能','大模型','Optimus','Siri'];
  const worldKw = ['美国','日本','欧盟','德国','英国','美联储','国际','全球','中东','霍尔木兹','越南','东盟','印度','韩国','巴西'];

  if(tab==='all') return hot.concat(macro, livelihood, finance).slice(0,12);
  if(tab==='hot') return hot.slice(0,10);
  if(tab==='pol') return [...macro, ...hot.filter(x=>hasNewsKw(x.t+x.desc, polKw)), ...livelihood.filter(x=>hasNewsKw(x.t+x.desc, polKw))].slice(0,10);
  if(tab==='finance') return finance.slice(0,10);
  if(tab==='tech') return tech.slice(0,10);
  if(tab==='world') return [...world, ...hot.filter(x=>hasNewsKw(x.t+x.desc, worldKw))].slice(0,10);
  return hot.slice(0,10);
}

function enTab(i){ document.querySelectorAll("#en_tabs .tab").forEach((t,k)=>t.classList.toggle("active",k===i));
  for(let k=0;k<9;k++){ const s=document.getElementById("en_"+k); if(s) s.classList.toggle("active",k===i); } }
let wbFilter="all";
function wbSearch(q){ q=(q||"").toLowerCase(); const list=document.getElementById("wb_list"); if(!list) return;
  Array.from(list.children).forEach(row=>{
    const w=row.getAttribute("data-w")||"", word=row.getAttribute("data-word")||"";
    const st=DB.get("wordstat",{})[word]||{};
    let show = w.includes(q);
    if(wbFilter==="no" && !st.no) show=false;
    if(wbFilter==="fav" && !st.fav) show=false;
    row.style.display = show?"":"none";
  });
}
function syncChips(){ document.querySelectorAll("#en_1 .chip").forEach(c=>{ const f=c.getAttribute("data-f"); c.classList.toggle("on", f===wbFilter); }); }
function showZAns(i){ const box=document.getElementById("zans_"+i); if(!box) return; const hide=box.style.display!=="none"; box.style.display=hide?"none":"block";
  const btn=document.getElementById("zbtn_"+i); if(btn) btn.textContent=hide?"查看参考答案":"收起答案"; }
function setWB(b){ const s=DB.get("settings",{}); s.wordbook=b; DB.set("settings",s); p_english(); toast('已切换到'+(b==='cet4'?'四六级':b==='ielts'?'雅思':'外企职场')+'词书'); }
const WF=DB.get("wordstat",{}); // {word:{master,fuzzy,no,fav}}
function wf(w, act){
  const st=DB.get("wordstat",{}); const o=st[w]||{master:0,fuzzy:0,no:0,fav:0};
  if(act==='fav') o.fav=o.fav?0:1; else o[act]=(o[act]||0)+1;
  st[w]=o; DB.set("wordstat",st); toast(act==='fav'?(o.fav?'已收藏 ⭐':'已取消收藏'):'已记录');
}
function enGame(type){
  const wb=(DB.get("settings",{}).wordbook)||"cet4"; const words=WORD_BOOKS[wb]||WORD_BOOKS.cet4;
  const box=document.getElementById("en_game"); const st=DB.get("wordstat",{});
  if(type==='listen'){
    const w=words[Math.floor(Math.random()*words.length)];
    playTTS(w.w);
    const opts=shuffle(words).slice(0,4).map(x=>x.w); if(!opts.includes(w.w)) opts[0]=w.w;
    box.innerHTML='<div>听发音，选出正确单词：</div>'+shuffle(opts).map(o=>`<button class="chip" onclick="enAnswer('${o}','${w.w}')">${o}</button>`).join('');
  } else if(type==='spell'){
    const w=words[Math.floor(Math.random()*words.length)];
    box.innerHTML=`<div>拼写：<b>${w.cn}</b> / ${w.ph}</div><input id="sp_in" class="input" style="margin:6px 0" placeholder="输入英文"/> <button class="btn sm" onclick="enAnswer(document.getElementById('sp_in').value,'${w.w}')">提交</button>`;
  } else {
    const sample=shuffle(words).slice(0,6);
    box.innerHTML='<div>单词消消乐：点两个相同释义配对</div>'+sample.map(x=>`<button class="chip" onclick="toast('${esc(x.w)}: ${esc(x.cn)}')">${esc(x.cn)}</button>`).join(' ')+'<div class="note" style="margin-top:6px">（完整消消乐为增强版，可后续接入）</div>';
  }
}
function enAnswer(a,b){ if(a.trim().toLowerCase()===b.toLowerCase()){ toast('✅ 正确'); const st=DB.get("wordstat",{}); } else { toast('❌ 正确答案：'+b); const st=DB.get("wordstat",{}); const o=st[b]||{master:0,fuzzy:0,no:0,fav:0}; o.no=(o.no||0)+1; st[b]=o; DB.set("wordstat",st);} }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 账单导入解析（CSV/Excel文本；Excel二进制需后端，此处支持CSV与文本） */
function importBill(){
  const f=document.getElementById("bill_file").files[0]; if(!f){toast('先选文件');return;}
  const reader=new FileReader();
  reader.onload=e=>{ parseBill(String(e.target.result)); };
  reader.readAsText(f,"utf-8");
}
function parseBill(text){
  const lines=text.split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length){ toast('文件为空'); return; }
  const norm=s=>s.replace(/^["']|["']$/g,"").trim();
  const findCol=(hdr,keys)=>{ const h=hdr.map((x,i)=>[norm(x),i]); for(const k of keys){ const f=h.find(([n])=>n.includes(k)); if(f) return f[1]; } return -1; };
  const hdr=lines[0].split(/[,，\t]/).map(norm);
  const ci_time=findCol(hdr,["时间","日期","time","date"]);
  const ci_other=findCol(hdr,["对方","商户","name","counterparty","交易对方"]);
  const ci_goods=findCol(hdr,["商品","备注","goods","item","摘要"]);
  const ci_io=findCol(hdr,["收/支","收支","type","方向","收入支出"]);
  const ci_amt=findCol(hdr,["金额","amount","钱","元"]);
  const CAT={ "美团":"餐饮","饿了么":"餐饮","滴滴":"交通","12306":"交通","淘宝":"购物","京东":"购物","拼多多":"购物","物业费":"住房","房租":"住房","电影":"娱乐","腾讯":"娱乐","爱奇艺":"娱乐","医院":"医疗","药店":"医疗","诊所":"医疗","学费":"教育","培训":"教育" };
  function classify(other,goods){ const s=(other||"")+(goods||""); for(const k in CAT){ if(s.includes(k)) return CAT[k]; } return "其他"; }
  function parseDate(s){
    s=norm(s);
    if(/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) return s.slice(0,10);
    let m=s.match(/(\d{4})[年\/](\d{1,2})[月\/](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
    if(/^\d{5,}$/.test(s)){ const d=new Date((+s-25569)*86400000); return d.toISOString().slice(0,10); } // Excel序列号
    return "";
  }
  let ok=0, skip=0; const bad=[]; const tx=DB.get("tx",[]);
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(/[,，\t]/).map(norm);
    const rawTime=c[ci_time]||"", rawAmt=c[ci_amt]||"", rawIo=c[ci_io]||"";
    const date=parseDate(rawTime); const amt=parseFloat(String(rawAmt).replace(/[^\d.\-]/g,""));
    if(!date||isNaN(amt)){ bad.push({line:i+1,reason:!date?"日期格式无法识别":"金额为空",raw:lines[i].slice(0,40)}); skip++; continue; }
    let type="out"; if(/收|入|in/i.test(rawIo)||amt<0) type= amt<0?"out":"in"; if(amt<0) type="out";
    const amtAbs=Math.abs(amt);
    const other=c[ci_other]||"", goods=c[ci_goods]||"";
    tx.push({date,type,cat:classify(other,goods),amt:amtAbs,note:other||goods||""});
    ok++;
  }
  DB.set("tx",tx);
  toast(`成功 ${ok} 条，跳过 ${skip} 条`);
  if(bad.length){ DB.set("bill_bad",bad); setTimeout(()=>exportBad(),300); }
  p_money();
}
function exportBad(){
  const bad=DB.get("bill_bad",[]); if(!bad.length) return;
  let csv="行号,原因,原始片段\n"+bad.map(b=>`${b.line},${b.reason},"${b.raw}"`).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="账单异常明细.csv"; a.click();
  toast("已导出异常明细");
}

/* ============================================================
   数据备份 / 退出自动保存
   ============================================================ */
function autoSaveAll(){ try{
  if(document.getElementById("plan_today")) savePlan('today');
  if(document.getElementById("plan_week")) savePlan('week');
  if(document.getElementById("plan_month")) savePlan('month');
  if(document.getElementById("body_note")) saveBody();
}catch(e){} }
function exportBackup(){
  const data={}; let n=0;
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf("yiyi_")===0){ try{ data[k]=JSON.parse(localStorage.getItem(k)); }catch(e){ data[k]=localStorage.getItem(k); } n++; } }
  const payload={app:"壹壹",version:1,exportedAt:new Date().toISOString(),data};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="壹壹-数据备份-"+todayStr()+".json"; document.body.appendChild(a); a.click(); a.remove();
  toast("已导出 "+n+" 项数据备份 ✦");
}
function importBackup(file){ if(!file) return; const r=new FileReader();
  r.onload=function(e){ try{ const o=JSON.parse(e.target.result); const src=o.data||o; let n=0;
    for(const k in src){ if(k.indexOf("yiyi_")===0){ const v=src[k]; localStorage.setItem(k, typeof v==="object"?JSON.stringify(v):String(v)); n++; } }
    toast("已恢复 "+n+" 项，正在刷新…"); initWelcome(); renderCoins(); renderNav(); renderContent();
  }catch(err){ toast("备份文件解析失败"); } };
  r.readAsText(file);
}
function openBackup(){
  const html=`<span class="close" onclick="closeModal()">✕</span>
   <h3>💾 数据备份</h3>
   <div class="note">所有记录保存在本机浏览器（localStorage）。换设备 / 清缓存前建议导出；重装或换手机后可导入恢复。</div>
   <button class="btn" style="margin-top:10px;width:100%" onclick="exportBackup()">⬇️ 一键导出全部数据备份</button>
   <div class="row" style="margin-top:10px"><button class="btn ghost" style="flex:1" onclick="document.getElementById('backup_file2').click()">⬆️ 导入恢复备份</button>
     <input type="file" id="backup_file2" accept=".json" style="display:none" onchange="importBackup(this.files[0]);this.value='';closeModal()"/></div>
   <div class="note" style="margin-top:10px">🛡️ 退出或切后台时，当日计划与身体记录会自动保存，无需每次手动点保存。</div>`;
  openModal(html);
}

/* ============================================================
   顶栏交互 + 初始化
   ============================================================ */
document.getElementById("btn_collapse").onclick=()=>{ const c=!DB.get("navCollapsed",false); DB.set("navCollapsed",c); renderNav(); };
document.getElementById("btn_edit").onclick=()=>{ editing=!editing; if(!editing) DB.set("order",getOrder()); renderNav(); toast(editing?'编辑模式：拖动排序，完成后点 ✥':'已保存模块顺序'); };
document.getElementById("btn_backup").onclick=()=>openBackup();
window.addEventListener("pagehide", autoSaveAll);
window.addEventListener("beforeunload", autoSaveAll);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") autoSaveAll(); });

function loadRemote(){
  fetch('data.json').then(r=>r.json()).then(d=>{ REMOTE=d; renderContent(); }).catch(e=>{ renderContent(); });
}
initWelcome();
renderCoins();
renderNav();
loadRemote();
</script>
