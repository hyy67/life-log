name: 每日数据更新
on:
  schedule:
    # UTC 时间；对应北京时间 9:00 / 15:00 / 23:00
    # 15:00 UTC(23:00 北京) 覆盖收盘后复盘；9:00 UTC 覆盖早间新闻
    - cron: '0 1,7,15 * * *'
  workflow_dispatch: {}   # 允许在 GitHub 网页手动点一下立即运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取行情 / 新闻 / 英语素材 → 生成 data.json
        env:
          ENGLISH_RSS: ${{ vars.ENGLISH_RSS }}
          WEATHER_CITY: ${{ vars.WEATHER_CITY }}
        run: python3 fetch_data.py

      - name: 生成音频速览 MP3（edge-tts，随口播稿每日更新）
        run: |
          pip install edge-tts >/dev/null 2>&1 || pip3 install edge-tts >/dev/null 2>&1
          python3 gen_audio.py

      - name: 提交更新
        run: |
          git config user.name "life-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json audio/
          git diff --cached --quiet || git commit -m "auto: update data.json + audio"
          git push
